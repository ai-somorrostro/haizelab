# docker-compose.yml
# ==================
# Orquestación del proyecto HaizeLab (Reto 0 - CF Somorrostro).
#
# Servicios principales en tiempo real:
#   influxdb       — Base de datos de series temporales (InfluxDB 2.9.1 en :8086)
#   influxdb_setup — Contenedor de inicialización: crea buckets y 4 tokens de acceso
#   nodered        — Ingesta en tiempo real (clima, tráfico, demo NO₂ en :1880)
#   grafana        — Dashboards analíticos y control de acceso por roles en :3000
#   influx-mcp     — Servidor MCP para consultas de IA (requisito PIA en :5001)
#   chatbot        — Asistente explicable en FastAPI en :8000
#   presentacion   — Web interactiva de diapositivas en :8080
#
# Puesta en marcha:
#   1. cp .env.example .env
#   2. docker compose up -d --build
#   3. Abrir en navegador: http://localhost:8080

services:

  # ── InfluxDB 2.9.1 (Series Temporales) ───────────────────────────────────────
  influxdb:
    image: influxdb:2.9.1
    container_name: haizelab_influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD:    ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG:         ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET:      ${INFLUXDB_BUCKET_PRINCIPAL}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXD_SESSION_LENGTH:           43200
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── InfluxDB Setup (Creación de Buckets y Tokens de Mínimo Privilegio) ───────
  influxdb_setup:
    image: influxdb:2.9.1
    container_name: haizelab_influxdb_setup
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      DOCKER_INFLUXDB_INIT_ORG:         ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
      INFLUXDB_RETENTION_METEO:         ${INFLUXDB_RETENTION_METEO}
      INFLUXDB_RETENTION_TRAFICO:       ${INFLUXDB_RETENTION_TRAFICO}
      INFLUXDB_RETENTION_AIRE_DEMO:     ${INFLUXDB_RETENTION_AIRE_DEMO}
    volumes:
      - ./influxdb/init-influxdb.sh:/init-influxdb.sh:ro
      - influxdb_tokens:/tokens
    command: ["sh", "/init-influxdb.sh"]
    restart: "no"

  # ── Node-RED 5.0 (Ingesta en Tiempo Real) ────────────────────────────────────
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    image: haizelab_nodered:latest
    container_name: haizelab_nodered
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      influxdb_setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      INFLUXDB_URL:                 http://influxdb:8086
      INFLUXDB_ORG:                 ${INFLUXDB_ORG}
      AIRE_DEMO_CSV:                /data/no2_demo_reducido.csv
      NODE_RED_CREDENTIAL_SECRET:   ${NODE_RED_CREDENTIAL_SECRET}
      NODE_RED_ADMIN_USER:          ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD:      ${NODE_RED_ADMIN_PASSWORD}
    volumes:
      - nodered_data:/data
      - ./nodered/flows.json:/data/flows.json:ro
      - ./nodered/settings.js:/data/settings.js:ro
      - ./ingesta/no2_demo_reducido.csv:/data/no2_demo_reducido.csv:ro
      - influxdb_tokens:/tokens:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Grafana 11.2 (Visualización y Control de Acceso RBAC) ────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: haizelab_grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      influxdb_setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG_NAME=HaizeLab
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/haizelab-overview.json
      - INFLUXDB_ORG=${INFLUXDB_ORG:-haizenlab}
      - GRAFANA_DEFAULT_PASSWORD=${GRAFANA_DEFAULT_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/entrypoint.sh:/entrypoint.sh:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/access-control:/etc/grafana/provisioning/access-control:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/maps/zbe_bilbao.geojson:/usr/share/grafana/public/gazetteer/zbe_bilbao.geojson:ro
      - influxdb_tokens:/tokens:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Servidor MCP (Model Context Protocol - Requisito PIA) ───────────────────
  influx-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: haizelab_influx_mcp:latest
    container_name: haizelab_influx_mcp
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      influxdb_setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_TOKEN: ${INFLUXDB_MCP_TOKEN:-}
      MCP_LISTEN_HOST: 0.0.0.0
      MCP_LISTEN_PORT: 5001
    volumes:
      - influxdb_tokens:/tokens:ro

  # ── Chatbot Assistant (FastAPI Local) ───────────────────────────────────────
  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    image: haizelab_chatbot:latest
    container_name: haizelab_chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Presentación Web Interactiva (Nginx estático) ───────────────────────────
  presentacion:
    image: nginx:alpine
    container_name: haizelab_presentacion
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./presentacion:/usr/share/nginx/html:ro

  # ── Servicios Opcionales de Pipeline Batch (Perfil "pipeline") ───────────────
  sbd-notebook:
    profiles: ["pipeline"]
    build: .
    image: haizelab:latest
    container_name: haizelab_sbd_notebook
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./docs/img:/app/docs/img
      - ./ingesta:/app/ingesta
    command: python -c "import nbformat; from nbclient import NotebookClient; nb = nbformat.read('notebooks/zbe_bilbao.ipynb', as_version=4); NotebookClient(nb, timeout=600, kernel_name='python3').execute(); nbformat.write(nb, 'notebooks/zbe_bilbao.ipynb'); print('[OK] Notebook ejecutado con exito')"

volumes:
  influxdb_data:
  influxdb_config:
  influxdb_tokens:
  nodered_data:
  grafana_data:
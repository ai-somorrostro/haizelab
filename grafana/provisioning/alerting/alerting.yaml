# grafana/provisioning/alerting/alerting.yaml
# ============================================
# Alertas de HaizeLab. Detalle de cada regla (umbral, ventana, for, destinatario) en docs/alertas.md.
#
# Calidad del aire (bucket aire_demo: un valor horario del histórico por estación cada 5 s):
#   - Límite horario   : algún valor horario de NO2 > 200 µg/m³ (límite horario de la UE, Directiva 2008/50/CE)
#   - Aviso preventivo : media de las últimas 24 horas de NO2 > 25 µg/m³ (guía diaria de la OMS, 2021)
#   El límite de 40 µg/m³ es de la media anual: no se evalúa con valores horarios ni en una alerta.
#
# Tráfico:
#   - Congestión alta  : ocupación media de los tramos > 35 % (criterio propio)
#
# Cada regla consulta InfluxDB (A), reduce a un número por serie (B) y lo compara con el umbral (C).

apiVersion: 1

# Regla antigua que comparaba valores horarios con el límite anual de 40 µg/m³
deleteRules:
  - orgId: 1
    uid: "alert-no2-superacion"

groups:
  # ────────────────────────────────────────────────────────────────
  # Grupo 1: Calidad del aire — NO2
  # ────────────────────────────────────────────────────────────────
  - orgId: 1
    name: "Calidad Aire NO2"
    folder: "HaizeLab Alertas"
    interval: 1m
    rules:

      - uid: "alert-no2-pico-horario"
        title: "NO₂ — Valor horario por encima del límite horario (> 200 µg/m³)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60    # valores horarios escritos en el último minuto
              to: 0
            datasourceUid: "InfluxDB-HaizeLab"
            model:
              datasource:
                type: influxdb
                uid: "InfluxDB-HaizeLab"
              query: |
                from(bucket: "aire_demo")
                  |> range(start: -1m)
                  |> filter(fn: (r) => r["_measurement"] == "contaminantes")
                  |> filter(fn: (r) => r["_field"] == "no2")
                  |> group(columns: ["estacion"])
                  |> max()
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: "__expr__"
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: max
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [200]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Un valor horario de NO₂ supera el límite horario de la UE (200 µg/m³)"
          description: "Estación {{ $labels.estacion }}: valor horario de {{ $values.B }} µg/m³. Basta un valor horario por encima de 200 µg/m³ para que haya superación."
        labels:
          severity: critical
          team: haizelab
          tipo: aire

      - uid: "alert-no2-aviso"
        title: "NO₂ — Aviso preventivo: media de 24 horas > 25 µg/m³"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600    # 10 min: 120 valores horarios por estación en la demo
              to: 0
            datasourceUid: "InfluxDB-HaizeLab"
            model:
              datasource:
                type: influxdb
                uid: "InfluxDB-HaizeLab"
              query: |
                from(bucket: "aire_demo")
                  |> range(start: -10m)
                  |> filter(fn: (r) => r["_measurement"] == "contaminantes")
                  |> filter(fn: (r) => r["_field"] == "no2")
                  |> group(columns: ["estacion"])
                  |> sort(columns: ["_time"])
                  |> tail(n: 24)
                  |> mean()
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: "__expr__"
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [25]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "La media de NO₂ de las últimas 24 horas supera la guía diaria de la OMS (25 µg/m³)"
          description: "Estación {{ $labels.estacion }}: media de las últimas 24 horas de {{ $values.B }} µg/m³. Es un aviso preventivo, no una superación legal."
        labels:
          severity: warning
          team: haizelab
          tipo: aire

  # ────────────────────────────────────────────────────────────────
  # Grupo 2: Tráfico — Congestión
  # ────────────────────────────────────────────────────────────────
  - orgId: 1
    name: "Trafico Congestion"
    folder: "HaizeLab Alertas"
    interval: 2m
    rules:

      - uid: "alert-trafico-congestion"
        title: "Tráfico — Congestión alta (ocupación media > 35 %)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800    # últimos 30 min
              to: 0
            datasourceUid: "InfluxDB-HaizeLab"
            model:
              datasource:
                type: influxdb
                uid: "InfluxDB-HaizeLab"
              query: |
                from(bucket: "trafico")
                  |> range(start: -30m)
                  |> filter(fn: (r) => r["_measurement"] == "estado")
                  |> filter(fn: (r) => r["_field"] == "ocupacion")
                  |> group()
                  |> mean()
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: "__expr__"
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [35]
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Congestión alta en Bilbao (ocupación media de los tramos > 35 %)"
          description: "La ocupación media de los tramos en los últimos 30 min es {{ $values.B }} % durante más de 10 min."
        labels:
          severity: warning
          team: haizelab
          tipo: trafico

# ────────────────────────────────────────────────────────────────
# Destinatario: correo de ALERT_EMAIL_TO (.env). Para que se envíe,
# hay que configurar el SMTP (variables GF_SMTP_* del .env).
# ────────────────────────────────────────────────────────────────
contactPoints:
  - orgId: 1
    name: haizelab-ops
    receivers:
      - uid: haizelab-ops-default
        type: email
        settings:
          addresses: "$__env{ALERT_EMAIL_TO}"
          singleEmail: false

policies:
  - orgId: 1
    receiver: haizelab-ops
    group_by: ["alertname", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: haizelab-ops
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 15m
